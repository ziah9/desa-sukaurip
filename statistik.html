<section class="hero">

<div>

<h1>Statistik Desa</h1>

<p>
Visualisasi Data Desa Sukaurip
</p>

</div>

</section>

<div class="container py-5">

<div class="row g-4">

<div class="col-lg-6">

<div class="card shadow p-4">

<h4>Data Pendidikan</h4>

<canvas id="pendidikanChart"></canvas>

</div>

</div>

<div class="col-lg-6">

<div class="card shadow p-4">

<h4>Data Pekerjaan</h4>

<canvas id="pekerjaanChart"></canvas>

</div>

</div>

<div class="col-lg-6">

<div class="card shadow p-4">

<h4>Data Penduduk</h4>

<canvas id="pendudukChart"></canvas>

</div>

</div>

<div class="col-lg-6">

<div class="card shadow p-4">

<h4>Potensi Desa</h4>

<canvas id="potensiChart"></canvas>

</div>

</div>

</div>

</div>
<script>

new Chart(
document.getElementById("pendidikanChart"),
{
type:"bar",
data:{
labels:["SD","SMP","SMA","Diploma","S1"],
datasets:[{
label:"Jumlah",
data:[850,720,980,250,320]
}]
}
}
);

new Chart(
document.getElementById("pekerjaanChart"),
{
type:"pie",
data:{
labels:["Petani","Buruh","Pedagang","Wirausaha","PNS"],
datasets:[{
data:[850,650,420,280,95]
}]
}
}
);

new Chart(
document.getElementById("pendudukChart"),
{
type:"doughnut",
data:{
labels:["Laki-laki","Perempuan"],
datasets:[{
data:[2220,2300]
}]
}
}
);

new Chart(
document.getElementById("potensiChart"),
{
type:"bar",
data:{
labels:["Pertanian","UMKM","Wisata","Peternakan"],
datasets:[{
label:"Potensi",
data:[90,75,60,55]
}]
}
}
);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
